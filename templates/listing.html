<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Directory - Profiles</title>
    <!-- Use Google Fonts (matching the login design) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
    
    <!-- Link to the main style.css for consistent general styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="listing-container">
        
        <!-- Top Navigation -->
        <div class="top-nav">
            <a href="/dashboard" class="back-dashboard">← Back to Dashboard</a>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #64748B;">PERSISTENT DATABASE (LOCALSTORAGE)</span>
        </div>

        <!-- Header -->
        <div class="header-section">
            <h1 class="title" style="margin-bottom: 5px;">Room <span class="gradient-text">Directory</span></h1>
            <p class="subtitle">Select a room to see user profiles, sign status, and manage listings.</p>
        </div>

        <!-- Room Navigation Tabs -->
        <div class="room-tabs" id="roomTabsContainer">
            <!-- Dynamic Room Tabs will render here -->
        </div>

        <!-- Active Room Content -->
        <div class="room-content">
            <div class="room-header">
                <div>
                    <h2 class="room-title" id="activeRoomTitle">Room A</h2>
                    <p style="color: #64748B; font-size: 0.9rem; margin-top: 4px;" id="activeRoomCount">0 Members</p>
                </div>
                <!-- Button to Add Room -->
                <button class="add-room-btn" onclick="openRoomModal()">+ Add New Room</button>
            </div>

            <!-- Profiles Grid -->
            <div class="profiles-grid" id="profilesGrid">
                <!-- Dynamic profile cards will render here -->
            </div>
        </div>

    </div>
