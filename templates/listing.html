<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Directory - Profiles</title>
    <!-- Use Google Fonts (matching the login design) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
    
    <!-- Link to the main style.css for consistent general styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <div class="listing-container">
        
        <!-- Top Navigation -->
        <div class="top-nav">
            <a href="/dashboard" class="back-dashboard">← Back to Dashboard</a>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #64748B;">PERSISTENT DATABASE (LOCALSTORAGE)</span>
        </div>

        <!-- Header -->
        <div class="header-section">
            <h1 class="title" style="margin-bottom: 5px;">Room <span class="gradient-text">Directory</span></h1>
            <p class="subtitle">Select a room to see user profiles, sign status, and manage listings.</p>
        </div>

        <!-- Room Navigation Tabs -->
        <div class="room-tabs" id="roomTabsContainer">
            <!-- Dynamic Room Tabs will render here -->
        </div>

        <!-- Active Room Content -->
        <div class="room-content">
            <div class="room-header">
                <div>
                    <h2 class="room-title" id="activeRoomTitle">Room A</h2>
                    <p style="color: #64748B; font-size: 0.9rem; margin-top: 4px;" id="activeRoomCount">0 Members</p>
                </div>
                <!-- Button to Add Room -->
                <button class="add-room-btn" onclick="openRoomModal()">+ Add New Room</button>
            </div>

            <!-- Profiles Grid -->
            <div class="profiles-grid" id="profilesGrid">
                <!-- Dynamic profile cards will render here -->
            </div>
        </div>

    </div>

    <!-- ================= ADD ROOM MODAL ================= -->
    <div class="modal-overlay" id="roomModal">
        <div class="modal-card">
            <h3 class="modal-title">Create New Room</h3>
            <div class="form-group">
                <label for="newRoomName">Room Name / Label</label>
                <input type="text" id="newRoomName" placeholder="e.g. Room G, Seminar Room" required>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeRoomModal()">Cancel</button>
                <button class="btn-submit" onclick="submitNewRoom()">Add Room</button>
            </div>
        </div>
    </div>

    <!-- ================= ADD MEMBER MODAL ================= -->
    <div class="modal-overlay" id="memberModal">
        <div class="modal-card">
            <h3 class="modal-title">Add Profile to <span id="modalTargetRoom"></span></h3>
            
            <div class="form-group">
                <label for="newMemberName">Full Name</label>
                <input type="text" id="newMemberName" placeholder="e.g. Samuel Lee" required>
            </div>

            <div class="form-group">
                <label for="newMemberEmail">Email Address</label>
                <input type="email" id="newMemberEmail" placeholder="e.g. sam@school.edu" required>
            </div>

            <div class="form-group">
                <label for="newMemberRole">Role / Occupation</label>
                <input type="text" id="newMemberRole" placeholder="e.g. Student, Moderator, Admin" required>
            </div>

            <div class="form-group">
                <label for="newMemberStatus">Agreement Status</label>
                <!-- Simple select box styled like our normal inputs -->
                <select id="newMemberStatus" style="width: 100%; height: 48px; padding: 0 15px; border: 1px solid #E2E8F0; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 15px; background-color: transparent; outline: none;">
                    <option value="Pending">Pending Signature</option>
                    <option value="Signed">Signed</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeMemberModal()">Cancel</button>
                <button class="btn-submit" onclick="submitNewMember()">Add Profile</button>
            </div>
        </div>
    </div>

        <!-- JavaScript code for data storage and dynamic rendering -->
    <script src="{{ url_for('static', filename='listing.js') }}"></script>
</body>
</html>
