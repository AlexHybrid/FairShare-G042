<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairShare — House Rental & Bill Splitter (Perfect UI)</title>
  <style>
    /* =================================
       GLOBAL VARIABLES & THEME SETTINGS
       ================================= */
    :root {
      --accent: #3b82f6;
      --bg-gradient: linear-gradient(135deg, #000428 0%, #004e92 100%);
      --navbar-bg: rgba(255, 255, 255, 0.95);
      --text-main: #ffffff;
      --text-nav: #333333;
      --max-width-content: 1000px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* =====================
       2. BODY & MAIN LAYOUT
       ===================== */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: var(--max-width-content);
      margin: 0 auto;
      padding: 0 1rem;
      width: 100%;
    }

    /* ==========================
       3. NAVIGATION BAR (HEADER)
       ========================== */
    header {
      padding: 2rem 0;
      width: 100%;
    }

    .navbar {
      background: var(--navbar-bg);
      width: 90%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      border-radius: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .navbar ul {
      display: flex;
      list-style: none;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .navbar a {
      text-decoration: none;
      color: var(--text-nav);
      font-weight: 500;
      font-size: 1rem;
      transition: 0.3s;
      padding: 0.25rem 0.5rem;
    }

    .navbar a:hover {
      color: var(--accent);
    }

    .navbar a.active {
      color: #3b82f6;
      border-bottom: 2px solid #3b82f6;
    }

    /* ==============================
       4. HERO SECTION (LANDING PAGE)
       ============================== */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 3rem;
      position: relative;

      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .hero-text {
      max-width: 50%;
      text-align: left;
    }

    .hero-text h1 {
      font-size: 4.5rem;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .hero-text p.slogan {
      font-size: 1.5rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    .divider {
      width: 250px;
      height: 4px;
      background: #1e3a8a;
      border-radius: 2px;
    }

    /* GLASS CARD */
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .glass-card h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .glass-card p {
      font-size: 0.95rem;
      color: #e2e8f0;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      padding: 0.9rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
    }

    .btn-blue {
      background: #4a8bf5;
      color: #fff;
      border: none;
    }

    .btn-blue:hover {
      background: #3b74d6;
    }

    .btn-outline {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* ==================================
       5. RESPONSIVE DESIGN (MOBILE VIEW)
       ================================== */
    @media (max-width: 900px) {
      .hero {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        gap: 3rem;
      }
      .hero-text {
        max-width: 100%;
        text-align: center;
      }
      .hero-text h1 {
        font-size: 3rem;
      }
      .divider {
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav class="navbar">
      <ul>
        <li><a href="Startup.html" class="active">Home</a></li>
        <li><a href="index.html">Login</a></li>
        <li><a href="#" onclick="alert('Please log in or sign up first!'); return false;">Settings</a></li>
        <li><a href="#" onclick="alert('Please log in or sign up first!'); return false;">Help</a></li>
        <li><a href="#" onclick="alert('Please log in or sign up first!'); return false;">About</a></li>
        <li><a href="#" onclick="alert('Please log in or sign up first!'); return false;">Contact</a></li>
        <li><a href="#" onclick="alert('Please log in or sign up first!'); return false;">FAQ</a></li>
      </ul>
    </nav>
  </header>

  <main class="container hero">
    <div class="hero-text">
      <h1>House Rental<br>& Bill Splitter</h1>
      <p class="slogan">Cheap. Fast. Easy.</p>
      <div class="divider"></div>
    </div>
    
    <div class="glass-card">
      <h2>Simplify Roommate<br>Expenses</h2>
      <p>Track utility bills, split room rent, and export detailed reports in Excel and PDF in just a few clicks.</p>
      <div class="btn-group">
        <a href="../index.html" class="btn btn-blue">Get Started</a>
        <a href="../index.html" class="btn btn-outline">Log In</a>
      </div>
    </div>
  </main>

</body>

</html>
